<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs & Bewerbung | Kleinarbeiten Bad Iburg</title>
    <style>
        /* Minimalistisches Design & Grundeinstellungen */
        :root {
            --primary-color: #1e293b; 
            --accent-color: #0ea5e9; 
            --bg-color: #ffffff; 
            --section-bg: #f8fafc; 
            --text-color: #334155;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--bg-color);
            -webkit-font-smoothing: antialiased; 
        }

        .container {
            max-width: 900px; 
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 3rem 0 2rem; 
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 400;
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .intro-section {
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 3rem;
        }

        .intro-section p {
            margin-bottom: 1.5rem;
        }

        .intro-section p:last-child {
            margin-bottom: 0;
        }

        /* Warum bei uns? - 3 Boxen */
        .benefits-list {
            list-style: none;
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            padding: 0;
        }

        .benefits-list li {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem 1rem;
            text-align: center;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .benefits-list li span {
            display: block;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .benefits-list li strong {
            display: block;
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        /* Formular Styles */
        .booking-section {
            background: var(--bg-color);
            padding: 2rem 0;
        }

        form {
            display: flex;
            flex-direction: column;
            margin-top: 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        label {
            font-weight: 600;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.5rem;
            margin-top: 1.5rem;
        }

        label:first-of-type {
            margin-top: 0;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="tel"], 
        input[type="number"],
        select, 
        textarea {
            width: 30%;
            padding: 1rem;
            background-color: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1); 
        }

        /* Checkbox-Gruppen Styling für das Bewerbungsformular */
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            background-color: var(--section-bg);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 0.8rem;
            margin-top: 0;
            transform: scale(1.2);
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            text-transform: none;
            font-size: 1rem;
            letter-spacing: normal;
            color: var(--text-color);
            cursor: pointer;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 2.5rem;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: var(--accent-color);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }

        footer {
            text-align: center;
            padding: 4rem 0 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }

        footer a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--primary-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .benefits-list {
                grid-template-columns: 1fr;
            }
            .checkbox-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
